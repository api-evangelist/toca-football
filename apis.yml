aid: toca-football
name: TOCA Football
description: 'TOCA Football, Inc. is a technology-enabled soccer experience and entertainment
  company headquartered in Costa Mesa, California, founded on the training methodology
  of former US international and Premier League player Eddie Lewis. It operates two
  businesses: TOCA Soccer, a network of indoor soccer training centers across the United
  States, Canada and Mexico offering private training, classes, clinics, camps, youth
  and adult leagues, tournaments and pickup play; and TOCA Social, a soccer-themed
  dining and entertainment venue brand. Its training centers pair a proprietary ball-delivery
  machine and digitalized smart targets with the MyTOCA player app, which tracks session
  performance, player cards, leaderboards and progress. TOCA is the official soccer
  training partner of Major League Soccer. TOCA publishes no public API, SDK, webhook
  or developer program: its software ships only as end-user consumer apps and in-venue
  systems.'
